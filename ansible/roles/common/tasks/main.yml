---
- name: Install packages llama-server needs
  ansible.builtin.apt:
    name:
      - libgomp1
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 600

- name: Create llama group
  ansible.builtin.group:
    name: llama
    system: true

- name: Create llama user (no login)
  ansible.builtin.user:
    name: llama
    group: llama
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create folders
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: llama
    mode: "0755"
  loop:
    - /opt/llama
    - /opt/llama/releases
    - /opt/llama/models
