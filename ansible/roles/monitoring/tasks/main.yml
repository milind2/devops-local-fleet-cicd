---
- name: Install Prometheus
  ansible.builtin.apt:
    name: prometheus
    state: present
    lock_timeout: 600

- name: Put our Prometheus config on the VM
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    mode: "0644"
    validate: promtool check config %s
  notify: Restart prometheus

- name: Start Prometheus and enable at boot
  ansible.builtin.systemd_service:
    name: prometheus
    state: started
    enabled: true

- name: Add Grafana's signing key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: "0644"

- name: Add Grafana's apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main"
    filename: grafana

- name: Install Grafana
  ansible.builtin.apt:
    name: grafana
    state: present
    lock_timeout: 600

- name: Tell Grafana where Prometheus is
  ansible.builtin.copy:
    src: grafana-datasource.yml
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    mode: "0644"
  notify: Restart grafana

- name: Start Grafana and enable at boot
  ansible.builtin.systemd_service:
    name: grafana-server
    state: started
    enabled: true

- name: Folder for dashboard files
  ansible.builtin.file:
    path: /var/lib/grafana/dashboards
    state: directory
    owner: grafana
    group: grafana
    mode: "0755"

- name: Tell Grafana to load dashboards from that folder
  ansible.builtin.copy:
    src: grafana-dashboards.yml
    dest: /etc/grafana/provisioning/dashboards/llama.yml
    mode: "0644"
  notify: Restart grafana

- name: Copy our dashboard
  ansible.builtin.copy:
    src: llama-dashboard.json
    dest: /var/lib/grafana/dashboards/llama-dashboard.json
    owner: grafana
    group: grafana
    mode: "0644"

- name: Read the Grafana admin password (file on the host, outside git)
  ansible.builtin.set_fact:
    grafana_admin_password: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'HOME') + '/.config/fleet/grafana_admin_password') }}"
  no_log: true

- name: Check whether Grafana already uses that password
  ansible.builtin.uri:
    url: http://127.0.0.1:3000/api/user
    user: admin
    password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    status_code: [200, 401]
  register: grafana_login
  until: grafana_login.status in [200, 401]
  retries: 30
  delay: 2
  no_log: true

- name: Set the Grafana admin password
  ansible.builtin.command: >-
    grafana-cli --homepath /usr/share/grafana --config /etc/grafana/grafana.ini
    admin reset-admin-password {{ grafana_admin_password }}
  when: grafana_login.status == 401
  changed_when: true
  no_log: true
